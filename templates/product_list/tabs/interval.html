<div class="card border-0">

    <div class="card-body">

        <h3 class="mb-3">
            Interval Upload
        </h3>

        <p class="text-secondary">

            Upload video dengan jeda waktu yang tetap.
            Contoh: setiap <strong>20 jam</strong>.

        </p>

        <div class="row">

            <div class="col-md-4">

                <label class="form-label">
                    Start Date
                </label>

                <input
                    id="start_date"
                    type="date"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Start Time
                </label>

                <input
                    id="start_time"
                    type="time"
                    class="form-control"
                    value="08:00">

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Interval (Hour)
                </label>

                <input
                    id="interval_hour"
                    type="number"
                    class="form-control"
                    value="20"
                    min="1">

            </div>

        </div>
        <hr>

        <div class="d-flex justify-content-end">

            <button
                type="button"
                class="btn btn-outline-primary me-2"
                onclick="saveIntervalSettings()">

                <i class="ti ti-device-floppy me-2"></i>
                Save

            </button>

            <button
                id="btnNext"
                type="button"
                class="btn btn-primary"
                onclick="buatJadwal()">

                Next
                <i class="ti ti-arrow-right ms-2"></i>

            </button>

        </div>
    </div>

</div>
<script>
function buatJadwal(){

    const uploadDirectory = document
    .getElementById("upload_directory")
    .value
    .trim();

    if(uploadDirectory === ""){

        alert("Silakan isi Upload Directory.");

        document.getElementById("upload_directory").focus();

        return;

    }

    const startDate = document.getElementById("start_date").value;
    if(!startDate){
        alert("Silakan pilih Start Date.");
        document.getElementById("start_date").focus();
        return;
    }

    const startTime = document.getElementById("start_time").value;
    if(!startTime){
        alert("Silakan pilih Start Time.");
        document.getElementById("start_time").focus();
        return;
    }

    // Cek creator dulu baru submit
    checkCreatorAndSubmit(function() {

        /* Build FormData */
        const formData = new FormData();

        formData.append("schedule_mode", "interval");
        formData.append("distribution_method", getDistributionMethod());
        formData.append("products", JSON.stringify(selectedProducts));
        formData.append("upload_directory", document.getElementById("upload_directory").value.trim());
        formData.append("start_date", startDate);
        formData.append("start_time", startTime);
        formData.append("interval_hour", document.getElementById("interval_hour").value);

        submitFormWithFetch(formData);

    });
    
}

// ==============================
// SAVE / LOAD INTERVAL SETTINGS
// ==============================

function getIntervalSaveConfig() {

    var intervalHourRaw = document.getElementById("interval_hour").value;
    var intervalHour = intervalHourRaw === "" ? null : parseFloat(intervalHourRaw);
    if (isNaN(intervalHour)) {
        intervalHour = null;
    }

    return {
        start_time: document.getElementById("start_time").value,
        interval_hour: intervalHour
    };

}

function saveIntervalSettings() {

    downloadScheduleSettings("interval", getIntervalSaveConfig());

}

function applyIntervalSettings(cfg) {

    cfg = cfg || {};

    if (!cfg.start_time && (cfg.interval_hour === undefined || cfg.interval_hour === null)) {

        console.warn(
            "[schedule-settings] applyIntervalSettings: config kosong / key " +
            "start_time & interval_hour tidak ada. config keys yang dibaca:",
            Object.keys(cfg)
        );

    }

    // Normalisasi tipe: terima nilai string maupun number
    if (cfg.start_time !== undefined && cfg.start_time !== null && cfg.start_time !== "") {

        var startTimeField = document.getElementById("start_time");

        if (startTimeField) {
            startTimeField.value = String(cfg.start_time);
        } else {
            console.warn("[schedule-settings] applyIntervalSettings: #start_time tidak ditemukan");
        }

    }

    if (cfg.interval_hour !== undefined && cfg.interval_hour !== null && cfg.interval_hour !== "") {

        var intervalField = document.getElementById("interval_hour");

        if (intervalField) {
            intervalField.value = String(cfg.interval_hour);
        } else {
            console.warn("[schedule-settings] applyIntervalSettings: #interval_hour tidak ditemukan");
        }

    }

}

</script>
