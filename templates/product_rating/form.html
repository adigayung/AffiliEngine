<div class="card mb-4">

    <div class="card-header">
        <h3 class="card-title">Product Analyzer</h3>
    </div>

    <div class="card-body">

        <form
            method="POST"
            action="/product-rating/analyze"
            enctype="multipart/form-data"
        >

            <!-- PRODUCT URL -->
            <div class="mb-3">
                <label class="form-label">
                    Product URL
                </label>

                <input
                    type="url"
                    class="form-control"
                    id="product_link"
                    name="product_link"
                    placeholder="https://..."
                >
            </div>

            <!-- PRODUCT IMAGE -->
            <div class="mb-3">
                <label class="form-label">
                    Product Image
                </label>

                <input
                    type="file"
                    class="form-control"
                    id="image"
                    name="image"
                    accept=".jpg,.jpeg,.png"
                >
            </div>

            <button class="btn btn-primary">
                Analyze Product
            </button>

        </form>

    </div>

</div>
